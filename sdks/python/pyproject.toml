[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.5"
description = "Zero-Leak Secret Defense & Shell Sandbox for Autonomous AI Agents in Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "RitualDev Lab", email = "security@ritualdev.in" }
]
keywords = ["security", "ai-agents", "secret-scanning", "redaction", "langchain", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0"
]
langchain = [
    "langchain-core>=1.8.3",
    "langgraph>=1.2.23"
]

[project.urls]
Homepage = "https://agentshield.ritualdev.in/"
Repository = "https://github.com/RitualDev-Lab/AgentShield"
Issues = "https://github.com/RitualDev-Lab/AgentShield/issues"
