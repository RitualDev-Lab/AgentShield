[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-defense"
version = "0.2.2"
description = "Zero-Leak Secret Defense & Shell Sandbox for Autonomous AI Agents in Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "RitualDev Lab", email = "security@ritualdev.in" }
]
keywords = ["security", "ai-agents", "secret-scanning", "redaction", "langchain", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0"
]
langchain = [
    "langchain-core>=1.8.3",
    "langgraph>=1.2.23"
]
crewai = [
    "crewai>=0.80.0"
]
llamaindex = [
    "llama-index-core>=0.11.0"
]
litellm = [
    "litellm>=1.40.0"
]
all = [
    "agentshield-defense[langchain,crewai,llamaindex,litellm]"
]

[project.urls]
Homepage = "https://agentshield.ritualdev.in/"
Repository = "https://github.com/RitualDev-Lab/AgentShield"
Issues = "https://github.com/RitualDev-Lab/AgentShield/issues"

[tool.setuptools.packages.find]
include = ["agentshield*"]

[tool.setuptools.package-data]
agentshield = ["py.typed"]
