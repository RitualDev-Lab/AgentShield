name: "AgentShield Security Gate"
description: "Zero-Leak Secret Defense & Sandbox for Pull Requests and Autonomous AI Agents"
author: "RitualDev Lab"

inputs:
  base_ref:
    description: "Target base git branch to compare diff against (default: origin/main)"
    required: false
    default: "origin/main"
  fail_on_leak:
    description: "Whether to fail the CI step if secrets are detected"
    required: false
    default: "true"
  github_token:
    description: "GitHub secret token used to post inline annotations and sticky PR comments"
    required: false
    default: "${{ github.token }}"
  post_pr_comment:
    description: "Whether to post or update a sticky security audit comment on Pull Requests"
    required: false
    default: "true"
  annotate_diff:
    description: "Whether to emit GitHub Actions inline workflow command annotations (::error)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run AgentShield CI Security Audit & PR Bot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        EXTRA_FLAGS=""
        if [ "${{ inputs.annotate_diff }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --annotate"
        fi
        if [ "${{ inputs.post_pr_comment }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --post-pr-comment"
        fi

        EXIT_CODE=0
        if [ -f "${{ github.action_path }}/dist/cli.js" ]; then
          node "${{ github.action_path }}/dist/cli.js" ci --base "${{ inputs.base_ref }}" --report .agentshield-report.md $EXTRA_FLAGS || EXIT_CODE=$?
        elif [ -f "${{ github.action_path }}/package.json" ]; then
          (cd "${{ github.action_path }}" && npm install --silent && npm run build --silent)
          node "${{ github.action_path }}/dist/cli.js" ci --base "${{ inputs.base_ref }}" --report .agentshield-report.md $EXTRA_FLAGS || EXIT_CODE=$?
        else
          npx --yes @ritualdev_lab/agentshield@latest ci --base "${{ inputs.base_ref }}" --report .agentshield-report.md $EXTRA_FLAGS || EXIT_CODE=$?
        fi
        
        if [ -f .agentshield-report.md ]; then
          cat .agentshield-report.md >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ inputs.fail_on_leak }}" = "true" ] && [ $EXIT_CODE -ne 0 ]; then
          echo "❌ [AgentShield] Exposed secrets detected in Pull Request diff. Merging blocked."
          exit $EXIT_CODE
        fi

branding:
  icon: "shield"
  color: "purple"

