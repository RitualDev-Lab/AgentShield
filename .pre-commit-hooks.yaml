- id: agentshield
  name: AgentShield Secret Gate
  description: High-assurance AI secret redactor and zero-leak commit shield
  entry: agentshield hook check
  language: node
  additional_dependencies: ["@ritualdev-lab/agentshield@0.1.2"]
  stages: [pre-commit]
  pass_filenames: false

- id: agentshield-audit
  name: AgentShield Agent Configuration Audit
  description: Static security audit of AI agent permissions (.claude, MCP servers)
  entry: agentshield audit --labs
  language: node
  additional_dependencies: ["@ritualdev-lab/agentshield@0.1.2"]
  stages: [pre-commit]
  pass_filenames: false
