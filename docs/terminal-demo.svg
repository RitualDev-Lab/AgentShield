<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .title { fill: #9ca3af; font-size: 13px; font-weight: 500; }
    .prompt { fill: #06b6d4; font-size: 13.5px; font-weight: 600; }
    .cmd { fill: #c084fc; font-size: 13.5px; font-weight: 600; }
    .text-red { fill: #f87171; font-size: 13px; font-weight: bold; }
    .text-yellow { fill: #fbbf24; font-size: 13px; }
    .text-green { fill: #34d399; font-size: 13px; font-weight: 600; }
    .text-dim { fill: #6b7280; font-size: 12.5px; }
    .text-white { fill: #f3f4f6; font-size: 13px; }
    .cursor { animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Window Container -->
  <rect x="25" y="20" width="800" height="400" rx="12" fill="url(#bg-grad)" stroke="#374151" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Window Header -->
  <path d="M 25 32 Q 25 20 37 20 L 813 20 Q 825 20 825 32 L 825 58 L 25 58 Z" fill="#1f2937" />
  <line x1="25" y1="58" x2="825" y2="58" stroke="#374151" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="50" cy="39" r="6" fill="#ef4444" />
  <circle cx="70" cy="39" r="6" fill="#f59e0b" />
  <circle cx="90" cy="39" r="6" fill="#10b981" />
  <text x="425" y="44" text-anchor="middle" class="mono title">agent-sandbox@ritualdev: ~/workspace (AgentShield active)</text>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Agent tries command -->
  <text x="50" y="92" class="mono prompt">agent@claude-code:~$</text>
  <text x="235" y="92" class="mono cmd">npx agentshield exec "cat .env"</text>

  <!-- Line 2: Sandbox Intercept Alert -->
  <text x="50" y="125" class="mono text-red">🚨 [AgentShield Sandbox Block] Attempted credential exfiltration blocked!</text>
  <text x="50" y="148" class="mono text-yellow">&gt; Target: .env (Private environment configuration detected)</text>
  <text x="50" y="171" class="mono text-dim">&gt; Prevented raw API keys from entering agent LLM context window.</text>

  <!-- Divider -->
  <line x1="50" y1="195" x2="800" y2="195" stroke="#374151" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Line 3: Git Pre-Commit Gate -->
  <text x="50" y="228" class="mono prompt">agent@cursor:~$</text>
  <text x="185" y="228" class="mono cmd">git commit -m "add payment webhook"</text>

  <!-- Line 4: Pre-Commit Gate Run -->
  <text x="50" y="260" class="mono text-white">🔍 [AgentShield Gate] Auditing staged files for credential leaks...</text>
  <text x="50" y="283" class="mono text-red">❌ BLOCKED: Found 1 exposed credential in 'services/stripe.ts' (Line 14):</text>
  <text x="70" y="306" class="mono text-yellow">• [CRITICAL] Stripe Live Secret Key: [AGENT_SHIELD:STRIPE:c2tfbGl2]</text>
  <text x="50" y="329" class="mono text-dim">&gt; Git commit aborted. Zero secrets escaped to repository.</text>

  <!-- Line 5: Clean Result -->
  <text x="50" y="365" class="mono prompt">agent@windsurf:~$</text>
  <text x="200" y="365" class="mono cmd">npx agentshield scan . --clean</text>
  <text x="50" y="392" class="mono text-green">✅ [CLEAN] Workspace shielded. 0 credentials exposed. Safe to run agents.</text>
  <rect x="710" y="380" width="8" height="15" fill="#06b6d4" class="cursor"/>
</svg>
