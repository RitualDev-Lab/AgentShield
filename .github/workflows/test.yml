name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Test Suite & Biome Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Formatting & Lint
        run: pnpm run lint

      - name: Run Test Suite
        run: pnpm test

      - name: Build Bundles
        run: pnpm run build

      - name: Dogfood AgentShield CI Security Gate
        run: npx tsx src/cli.ts ci --base HEAD~1

