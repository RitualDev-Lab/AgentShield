name: 🛡️ AgentShield PR Security Gate & Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: read-all

jobs:
  audit-pr:
    name: Zero-Leak PR Gate & Review Bot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Code Quality & Build
        run: |
          pnpm run lint
          pnpm run build
          pnpm test

      - name: Run AgentShield Security Gate Action
        id: gate
        continue-on-error: true
        uses: ./
        with:
          base_ref: "origin/${{ github.base_ref }}"
          fail_on_leak: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          post_pr_comment: "true"
          annotate_diff: "true"
          sarif_file: ".agentshield.sarif"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always() && hashFiles('.agentshield.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: .agentshield.sarif

      - name: Enforce PR Security Conclusion
        if: steps.gate.outcome != 'success'
        run: |
          echo "❌ [AgentShield Gate] Merging blocked due to exposed credentials in Pull Request."
          exit 1
