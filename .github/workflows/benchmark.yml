name: Reproducible 10k-Call Latency Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  benchmark-10k:
    name: 10k-Call Latency Matrix & Regression Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run 10,000-Call Reproducible Latency Matrix
        run: npx tsx benchmarks/run-10k-matrix.ts --iterations 10000 --out benchmarks/out --max-p99-ms 15

      - name: Upload JSON & CSV Benchmark Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentshield-10k-benchmark-matrix
          path: |
            benchmarks/out/benchmark-matrix.json
            benchmarks/out/benchmark-matrix.csv
          retention-days: 30
