name: Go SDK (sdks/go) CI

on:
  push:
    branches: [main]
    paths:
      - "sdks/go/**"
      - ".github/workflows/go-sdk.yml"
    tags:
      - "sdks/go/v*"
  pull_request:
    branches: [main]
    paths:
      - "sdks/go/**"
      - ".github/workflows/go-sdk.yml"
  workflow_dispatch:

permissions: read-all

jobs:
  test-go:
    name: Test Go SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet & Test Go Module
        working-directory: sdks/go
        run: |
          go vet ./...
          go test -v ./...
