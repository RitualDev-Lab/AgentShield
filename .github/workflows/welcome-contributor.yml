name: 💬 PR & Issue Contributor Welcome & Review Bot

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome-contributor:
    name: Welcome Contributor & Triage
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Pull Request Contributor
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const isBot = pr.user.type === 'Bot';
            if (isBot) return;

            const welcomeBody = `### 👋 Thanks for opening this Pull Request, @${author}!

Thank you for contributing to **AgentShield**! 🛡️

Here is what happens next:
1. 🧪 **Automated Security Gate**: Our CI workflow (\`pr-gate.yml\`) audits your diff for accidental credential exposure and runs test suites.
2. 🔍 **Code & Security Review**: A maintainer from @RitualDev-Lab will review your changes shortly.
3. 🌟 **Contributor Recognition**: Once merged, you'll be featured on our contributors list!

> 💡 **Tip**: Make sure secrets/mock API keys in tests are synthetic/redacted and tests pass locally (\`pnpm test\`).`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: welcomeBody
            });

      - name: Welcome Issue Author
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;
            const isBot = issue.user.type === 'Bot';
            if (isBot) return;

            const welcomeBody = `### 👋 Thanks for reporting this issue, @${author}!

We appreciate your vigilance in keeping AI agents secure with **AgentShield**. 🛡️

Our security team will review and triage this report shortly. If this is a suspected vulnerability or security finding, remember you can also disclose responsibly via our [Security Policy](https://github.com/RitualDev-Lab/AgentShield/security/policy).

> 🤝 Want to contribute a fix or pattern? Let us know and we'd be happy to guide you through opening a PR!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: welcomeBody
            });
